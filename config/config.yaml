web:
  port: 8080

endpoints:
  # --- External HTTP ---
  - name: google
    group: external
    url: https://www.google.com
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"

  # --- Self check (inside the container) ---
  - name: gatus-self
    group: internal
    url: http://localhost:8080/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  # --- App (public) ---
  - name: tm-homepage
    group: app
    url: https://tm.paramjyot2ray.com/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 800"

  # --- Frontend (separate group for nicer dashboard) ---
  - name: tm-frontend
    group: frontend
    url: https://tm.paramjyot2ray.com/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 800"

  # --- Backend (health endpoint) ---
  - name: tm-backend
    group: backend
    url: https://tm.paramjyot2ray.com/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"



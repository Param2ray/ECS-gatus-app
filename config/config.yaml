web:
  port: 8080

endpoints:
  # --- External HTTP ---
  - name: google
    group: external
    url: https://www.google.com
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"

  # --- Self check ---
  - name: gatus-self
    group: internal
    url: http://localhost:8080/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  # --- App homepage ---
  - name: tm-homepage
    group: app
    url: https://tm.paramjyot2ray.com/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 800"

  # --- DNS checks ---
  - name: dns-google
    group: external
    dns:
      query-name: google.com
      query-type: A
    interval: 30s
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: dns-tm-domain
    group: app
    dns:
      query-name: tm.paramjyot2ray.com
      query-type: A
    interval: 30s
    conditions:
      - "[DNS_RCODE] == NOERROR"

  # --- Frontend ---
  - name: tm-frontend
    group: frontend
    url: https://tm.paramjyot2ray.com/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 800"

  # --- Backend ---
  - name: tm-backend
    group: backend
    url: https://tm.paramjyot2ray.com/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  # --- ICMP-style connectivity check ---
  - name: icmp-ping
    group: external
    url: https://example.org
    interval: 30s
    conditions:
      - "[CONNECTED] == true"



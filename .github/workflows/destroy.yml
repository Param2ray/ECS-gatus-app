name: Terraform Destroy (Runtime)

on:
  workflow_dispatch:
    inputs:
      terraform_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  INFRA_PATH: terraform
  IMAGE_TAG: ${{ github.sha }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: ${{ inputs.terraform_destroy == 'DESTROY' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform destroy plan
        id: plan
        uses: dflook/terraform-plan@v2
        with:
          path: ${{ env.INFRA_PATH }}
          destroy: true
          refresh: false
          variables: |
            name                 = "${{ vars.NAME }}"
            vpc_cidr             = "${{ vars.VPC_CIDR }}"
            az_count              = ${{ vars.AZ_COUNT }}
            availability_zones   = ${{ vars.AVAILABILITY_ZONES_JSON }}
            public_subnet_cidrs  = ${{ vars.PUBLIC_SUBNET_CIDRS_JSON }}
            private_subnet_cidrs = ${{ vars.PRIVATE_SUBNET_CIDRS_JSON }}

            domain_name          = "${{ vars.DOMAIN_NAME }}"
            subdomain            = "${{ vars.SUBDOMAIN }}"
            zone_name            = "${{ vars.ZONE_NAME }}"

            cloudflare_api_token  = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id    = "${{ vars.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"

            aws_region           = "${{ env.AWS_REGION }}"
            cluster_name         = "${{ vars.CLUSTER_NAME }}"
            container_name       = "${{ vars.CONTAINER_NAME }}"
            task_family          = "${{ vars.TASK_FAMILY }}"
            task_name            = "${{ vars.TASK_NAME }}"

            image_tag            = "${{ env.IMAGE_TAG }}"
            ecr_repository_url   = "${{ vars.ECR_REPOSITORY_URL }}"

            github_repo               = "${{ vars.REPO_NAME }}"
            github_actions_role_name  = "${{ vars.ACTIONS_ROLE_NAME }}"
            lock_table_name           = "${{ vars.LOCK_TABLE_NAME }}"

      - name: Terraform apply (destroy)
        uses: dflook/terraform-apply@v2
        with:
          path: ${{ env.INFRA_PATH }}
          plan_path: ${{ steps.plan.outputs.plan_path }}
          auto_approve: true







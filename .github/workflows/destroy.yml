name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform destroy plan (runtime only)
        id: plan
        uses: dflook/terraform-plan@v2
        with:
          path: ${{ vars.INFRA_PATH }}
          destroy: true
          target: |
            module.vpc
            module.alb
            module.ecs
            module.acm
            module.domain
          variables: |
            cloudflare_api_token      = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id        = "${{ vars.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id     = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
            aws_region                = "${{ vars.AWS_REGION }}"
            image_tag                 = "${{ github.sha }}"

            github_repo               = "${{ vars.REPO_NAME }}"
            github_actions_role_name  = "${{ vars.ACTIONS_ROLE_NAME }}"
            lock_table_name           = "${{ vars.LOCK_TABLE_NAME }}"

            name                      = "${{ vars.TF_NAME }}"
            vpc_cidr                  = "${{ vars.TF_VPC_CIDR }}"
            az_count                  = ${{ vars.TF_AZ_COUNT }}
            availability_zones        = ${{ vars.TF_AVAILABILITY_ZONES }}
            public_subnet_cidrs       = ${{ vars.TF_PUBLIC_SUBNET_CIDRS }}
            private_subnet_cidrs      = ${{ vars.TF_PRIVATE_SUBNET_CIDRS }}

            domain_name               = "${{ vars.TF_DOMAIN_NAME }}"
            subdomain                 = "${{ vars.TF_SUBDOMAIN }}"
            zone_name                 = "${{ vars.TF_ZONE_NAME }}"
            container_name            = "${{ vars.TF_CONTAINER_NAME }}"
            cluster_name              = "${{ vars.TF_CLUSTER_NAME }}"
            task_family               = "${{ vars.TF_TASK_FAMILY }}"

            cpu                       = ${{ vars.TF_CPU }}
            memory                    = ${{ vars.TF_MEMORY }}
            desired_count             = ${{ vars.TF_DESIRED_COUNT }}

            manage_validation_records = ${{ vars.TF_MANAGE_VALIDATION_RECORDS }}

            ecr_repository_url        = "${{ vars.ECR_REPOSITORY_URL }}"

      - name: Terraform apply (destroy)
        uses: dflook/terraform-apply@v2
        with:
          path: ${{ vars.INFRA_PATH }}
          auto_approve: true
          plan_path: ${{ steps.plan.outputs.plan_path }}







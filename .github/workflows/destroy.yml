name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      terraform_destroy:
        description: 'Type "DESTROY" to confirm. This will delete runtime infrastructure.'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    if: ${{ inputs.terraform_destroy == 'DESTROY' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show destroy context
        run: |
          echo "INFRA_PATH = ${{ vars.INFRA_PATH }}"
          echo "AWS_REGION = ${{ vars.AWS_REGION }}"
          echo "Destroying runtime modules only (keeping IAM + ECR)"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform destroy plan (runtime only)
        id: plan
        uses: dflook/terraform-plan@v2
        with:
          path: ${{ vars.INFRA_PATH }}
          destroy: true
          target: |
            module.vpc
            module.alb
            module.ecs
            module.acm
            module.domain
          variables: |
            cloudflare_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id="${{ secrets.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            github_actions_role_name="${{ secrets.OIDC_ROLE_NAME }}"
            image_tag="${{ github.sha }}"

      - name: Terraform apply (destroy)
        uses: dflook/terraform-apply@v2
        with:
          path: ${{ vars.INFRA_PATH }}
          plan_path: ${{ steps.plan.outputs.plan_path }}
          auto_approve: true
          variables: |
            cloudflare_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id="${{ secrets.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            github_actions_role_name="${{ secrets.OIDC_ROLE_NAME }}"
            image_tag="${{ github.sha }}"






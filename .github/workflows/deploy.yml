name: Terraform Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "terraform-bootstrap/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # ✅ Guard rail: fail fast if the image tag doesn't exist in ECR
      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ vars.ECR_REPOSITORY }}" \
            --region "${{ vars.AWS_REGION }}" \
            --image-ids imageTag="${{ github.sha }}" > /dev/null

      - name: Terraform validate
        uses: dflook/terraform-validate@v2
        with:
          path: terraform

      - name: Terraform plan
        uses: dflook/terraform-plan@v2
        with:
          path: terraform

      - name: Terraform apply
        uses: dflook/terraform-apply@v2
        with:
          path: terraform
          auto_approve: true
          variables: |
            image_tag=${{ github.sha }}

  health-check:
    name: Post-Deploy Health Check
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://${{ vars.DOMAIN_NAME }}/health
          follow-redirect: true
          max-attempts: 20
          retry-delay: 15s

      - name: Deployment summary
        run: |
          echo "## Deployment Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform apply succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Health check passed: https://${{ vars.DOMAIN_NAME }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "App URL: https://${{ vars.DOMAIN_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"




   

name: Terraform Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "terraform-bootstrap/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: vpc-gatus
  IMAGE_TAG: ${{ github.sha }}

  ACTIONS_ROLE_NAME: ${{ vars.ACTIONS_ROLE_NAME }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  LOCK_TABLE_NAME: ${{ vars.LOCK_TABLE_NAME }}

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          echo "Checking for image tag $IMAGE_TAG in $ECR_REPOSITORY"
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" > /dev/null

      - name: Run Checkov (IaC scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

      - name: Terraform validate
        uses: dflook/terraform-validate@v2
        with:
          path: terraform

      - name: Terraform plan
        uses: dflook/terraform-plan@v2
        with:
          path: terraform
          variables: |
            cloudflare_api_token      = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id        = "${{ vars.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id     = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
            image_tag                 = "${{ env.IMAGE_TAG }}"

            github_actions_role_name  = "${{ env.ACTIONS_ROLE_NAME }}"
            github_repo               = "${{ env.REPO_NAME }}"
            state_bucket_name         = "${{ env.STATE_BUCKET_NAME }}"
            lock_table_name           = "${{ env.LOCK_TABLE_NAME }}"
            aws_region                = "${{ env.AWS_REGION }}"
            enable_destroy_policy     = false

      - name: Terraform apply
        uses: dflook/terraform-apply@v2
        with:
          path: terraform
          auto_approve: true
          variables: |
            cloudflare_api_token      = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            cloudflare_zone_id        = "${{ vars.CLOUDFLARE_ZONE_ID }}"
            cloudflare_account_id     = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
            image_tag                 = "${{ env.IMAGE_TAG }}"

            github_actions_role_name  = "${{ env.ACTIONS_ROLE_NAME }}"
            github_repo               = "${{ env.REPO_NAME }}"
            state_bucket_name         = "${{ env.STATE_BUCKET_NAME }}"
            lock_table_name           = "${{ env.LOCK_TABLE_NAME }}"
            aws_region                = "${{ env.AWS_REGION }}"
            enable_destroy_policy     = false

  health-check:
    name: Post-Deploy Health Check
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://${{ vars.FULL_DOMAIN }}/health
          follow-redirect: true
          max-attempts: 20
          retry-delay: 15s

      - name: Deployment summary
        run: |
          echo "## Deployment Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed image tag: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health check passed: https://${{ vars.FULL_DOMAIN }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "App URL: https://${{ vars.FULL_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"








   

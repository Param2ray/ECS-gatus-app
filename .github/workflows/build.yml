name: Build, Scan, Push to ECR

on:
  push:
    branches: [main]
    paths:
      - "Docker/**"
      - "app/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_scan_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (SHA + latest)
        id: build
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ secrets.ECR_REPOSITORY }}"
          SHA_TAG="${{ env.IMAGE_TAG }}"

          IMAGE_SHA="${REGISTRY}/${REPO}:${SHA_TAG}"
          IMAGE_LATEST="${REGISTRY}/${REPO}:latest"

          docker build -f Docker/Dockerfile -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT
          echo "image_latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ${{ steps.build.outputs.image_sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.build.outputs.image_sha }}"
          docker push "${{ steps.build.outputs.image_latest }}"



    

     

      

      
